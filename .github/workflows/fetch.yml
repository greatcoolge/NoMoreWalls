name: Fetch  
  
on:  
  workflow_dispatch:  
  schedule:  
    - cron: '0 0/3 * * *'  # 每 3 小时运行一次  
  push:  
    paths:  
      - 'sources.list'  
      - '**.py'  
  
jobs:  
  fetch:  
    runs-on: ubuntu-latest  
    steps:  
    - name: 迁出代码  
      uses: actions/checkout@v4  
        
    - name: 设置时区  
      run: sudo timedatectl set-timezone 'Asia/Shanghai'  
        
    - name: 安装 Python  
      uses: actions/setup-python@v5  
      with:  
        python-version: '3.x'  
        cache: 'pip'  
          
    - name: 安装依赖  
      run: pip install -r requirements.txt  
        
    - name: 执行任务  
      run: python ./fetch.py  
        
    - name: 提交更改  
      run: |                   
        git config --local user.email "actions@github.com"  
        git config --local user.name "GitHub Actions"  
        git pull origin NoMoreWalls1  # 改为您的分支名  
        git add list*  
        git add snippets/  
        # 只有在有变更时才提交  
        if git diff --staged --quiet; then  
          echo "没有变更,跳过提交"  
        else  
          git commit -m "$(date '+%Y-%m-%d %H:%M:%S') 抓取节点"  
        fi  
      
    - name: 推送更改  
      uses: ad-m/github-push-action@master  
      with:  
        branch: NoMoreWalls1  # 改为您的分支名
